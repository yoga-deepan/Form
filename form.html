<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/5f59ca6ad3.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="aurora-bg"></div>
    <div class="page-wrapper">
        <div class="glass-card">
            <div class="card-header">
                <i class="fas fa-user-plus"></i>
                <h1>Create Profile</h1>
                <p>Enter details to join the network</p>
            </div>

            <form id="myForm">
                <div class="input-container">
                    <i class="fas fa-signature icon"></i>
                    <input type="text" id="name" placeholder="Full Name" required>
                    <p id="nameErrMsg" class="error-text"></p>
                </div>

                <div class="input-container">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <p id="emailErrMsg" class="error-text"></p>
                </div>

                <div class="row">
                    <div class="col-6">
                        <label class="section-label">Status</label>
                        <select id="status" class="modern-select">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="section-label">Gender</label>
                        <div class="gender-toggle">
                            <input type="radio" name="gender" id="genderMale" value="Male" checked>
                            <label for="genderMale" class="gender-btn">Male</label>

                            <input type="radio" name="gender" id="genderFemale" value="Female">
                            <label for="genderFemale" class="gender-btn">Female</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="glow-btn">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

</html>
